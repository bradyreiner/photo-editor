# Keep every default detector. Exceptions below require BOTH the exact path
# family and a reviewed non-secret value/field; no directories or commits are skipped.
title = "Looksy secret scanning"
minVersion = "v8.30.1"
[extend]
useDefault = true

[[allowlists]]
description = "Exact public cache-prefix and camera-profile literals used by the scanner policy self-test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/test-secret-scanner\.py$''']
regexTarget = "secret"
regexes = ['''^render-plan-v2-fnv1a64-$''', '''^slog3-sgamut3-cine$''']

[[allowlists]]
description = "FNV render-plan identities computed by engine/src/pipeline/recipe_compiler.cpp, not authentication keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/evidence/''']
regexTarget = "match"
regexes = [
  '''^(?:canonical_plan_cache_key|canonicalPlanCacheKey|beforeCanonicalPlanCacheKey|afterCanonicalPlanCacheKey|baselineCanonicalRenderPlanCacheKey|recipeReopenCanonicalRenderPlanCacheKey|sampleCanonicalRenderPlanCacheKey|round-[1-8]CanonicalRenderPlanCacheKey)": ?"render-plan-v2-fnv1a64-[a-f0-9]{16}"$'''
]

[[allowlists]]
description = "SHA-256 provenance digests for the named source and public ONNX API files"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/evidence/''']
regexTarget = "match"
regexes = [
  '''^(?:customer_(?:edit_access\.h|access_controller\.(?:h|cpp)|access_controller_test\.cpp|credential_store\.(?:h|cpp))|onnxruntime_(?:cxx_api|ep_c_api|c_api)\.h)": "[a-f0-9]{64}"$'''
]

[[allowlists]]
description = "Public Hugging Face artifact SHA-256 values in the pinned SigLIP tokenizer manifest"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/desktop/src/search_model_install\.h$''']
regexTarget = "match"
regexes = [
  '''^(?:special_tokens_map\.json|tokenizer\.(?:json|model)|tokenizer_config\.json)", "[a-f0-9]{64}"$'''
]

[[allowlists]]
description = "Public Sony camera transform identifier, shared by menu data and transform selection code"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^apps/desktop/(?:qml/components/(?:TimelineColorConsole|TimelineEffectsPanel)\.qml|src/timeline_color_edit_controller\.cpp)$'''
]
regexTarget = "secret"
regexes = ['''^slog3-sgamut3-cine$''']

[[allowlists]]
description = "One observed SHA-1 thumbnailInvalidationKey digest in this receipt; bare SHA-1 matched the Sourcegraph rule"
targetRules = ["sourcegraph-access-token"]
condition = "AND"
paths = ['''^docs/evidence/agent-conversational-execution-2026-10-06/full-workflow-native-receipt-attempt-13\.json$''']
regexTarget = "secret"
regexes = ['''^a99dbead47ae3134360d5654f755b648e93978ad$''']

[[allowlists]]
description = "SHA-256 journal-chain previousEntryHash; its field name accidentally contains case-insensitive sentry"
targetRules = ["sentry-access-token"]
condition = "AND"
paths = ['''^docs/evidence/app-polish-2026-10-08/recovery-fingerprint-journal\.jsonl$''']
regexTarget = "match"
regexes = ['''^previousEntryHash":"[a-f0-9]{64}"$''']

[[allowlists]]
description = "Exact public interoperability JWTs generated by generate-desktop-fixture.mjs using a discarded ephemeral Ed25519 private key"
targetRules = ["jwt"]
condition = "AND"
paths = ['''^tests/fixtures/customer-lease\.json$''']
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJFZERTQSIsImtpZCI6Imxvb2tzeS0xIiwidHlwIjoiSldUIn0\.\.2bmIuz7KXWjWDrhDuSSBI30IZOvhD\-_m7LyuAxApS9gVyTOH1O7uYwlpVUy70FgGmxvvD01f35xdvPk_HxHqAg$''', # valid
