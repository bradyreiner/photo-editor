[package]
name = "photo-telemetry"
version = "0.1.0"
edition = "2021"

[dependencies]
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.31"
tracing = "0.1"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
