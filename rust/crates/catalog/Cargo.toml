[package]
name = "photo-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
getrandom = "0.2"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["migrate", "postgres", "runtime-tokio-rustls"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
walkdir = "2"
photo-telemetry = { path = "../telemetry" }

[dev-dependencies]
tempfile = "3"
