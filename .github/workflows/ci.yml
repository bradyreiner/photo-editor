name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  headless-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: rust
        run: cargo test --workspace

      - name: Configure CMake
        run: cmake --preset ci-headless

      - name: Build headless targets
        run: cmake --build --preset build-ci-headless

      - name: Run CTest
        run: ctest --preset test-ci-headless --output-on-failure
